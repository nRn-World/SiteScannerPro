services:
  - type: web
    name: sitescanner-pro
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://nrn-world.github.io,https://sitescannerpro-ten.vercel.app
