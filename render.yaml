services:
  - type: web
    name: sitescanner-pro
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false
      - key: KOFI_PRO_URL
        value: https://ko-fi.com/s/b525e21531
      - key: KOFI_LICENSE_KEY_HASH
        sync: false
      - key: LICENSE_SIGNING_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://nrnworld.one,https://nrn-world.github.io,https://sitescannerpro-ten.vercel.app
      - key: VITALS_API_KEY
        sync: false
